<!-- Social share image (1200x630). Replace with a branded PNG/JPG named og-image.png
     and update the og:image / twitter:image paths in index.html if you change the format. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1222"/><stop offset="1" stop-color="#141B2E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#FF5A3C" stop-opacity="0.35"/><stop offset="1" stop-color="#FF5A3C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF5A3C"/><stop offset="1" stop-color="#F6A609"/>
